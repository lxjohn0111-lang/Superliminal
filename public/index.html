<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lucid Angles</title>
<meta name="description" content="A first-person perspective puzzle game. Objects are exactly as big as they look.">
<link rel="stylesheet" href="style.css">
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- Loading screen (shown only while assets are generated) -->
  <div id="loading">
    <div class="load-inner">
      <div class="logo"><span class="logo-a">LUCID</span><span class="logo-b">ANGLES</span></div>
      <div class="load-tag">things are exactly as big as they look</div>
      <div class="load-bar"><div id="load-fill"></div></div>
      <div id="load-text">Drifting off…</div>
    </div>
  </div>

  <!-- In-world HUD -->
  <div id="hud">
    <div id="crosshair"><div class="ch-dot"></div><div class="ch-ring"></div><div class="ch-ticks"><i></i><i></i><i></i><i></i></div></div>
    <div id="prompt"></div>
    <div id="scale-readout"></div>
    <div id="subtitle"><span class="speaker"></span><span class="line"></span></div>
    <div id="chapter-card"><div class="cc-num"></div><div class="cc-title"></div><div class="cc-sub"></div></div>
    <div id="toasts"></div>
    <div id="crane-counter"><svg viewBox="0 0 24 24" class="crane-ico"><path d="M2 14 L10 11 L12 4 L14 11 L22 9 L15 14 L17 20 L12 16 L7 20 L9 14 Z"/></svg><span id="crane-count">0/3</span></div>
    <div id="timer"></div>
    <div id="hint-box"></div>
    <div id="controls-help"></div>
  </div>

  <div id="click-to-play"><div class="ctp-inner"><div class="ctp-title">Click to wake your senses</div><div class="ctp-sub">Mouse to look · WASD to move · Click to grab</div></div></div>

  <div id="fade"></div>
  <div id="vignette-flash"></div>

  <!-- Pause / main menu (only appears when the player leaves gameplay) -->
  <div id="menu" class="hidden">
    <div class="menu-bg"></div>
    <div class="menu-panel">
      <div class="menu-head">
        <div class="logo small"><span class="logo-a">LUCID</span><span class="logo-b">ANGLES</span></div>
        <div id="menu-sub" class="menu-sub"></div>
      </div>
      <div class="menu-body">
        <div class="menu-page" data-page="main">
          <button class="mbtn primary" data-act="resume">Resume</button>
          <button class="mbtn" data-act="hint"><span class="ad-badge">AD</span> Get a hint</button>
          <button class="mbtn" data-act="restart">Restart chapter</button>
          <button class="mbtn" data-act="checkpoint">Return to checkpoint</button>
          <button class="mbtn" data-act="chapters">Chapters</button>
          <button class="mbtn" data-act="achievements">Achievements</button>
          <button class="mbtn" data-act="settings">Settings</button>
        </div>
        <div class="menu-page" data-page="chapters"><div id="chapter-list"></div><button class="mbtn back" data-act="back">Back</button></div>
        <div class="menu-page" data-page="achievements"><div id="ach-list"></div><button class="mbtn back" data-act="back">Back</button></div>
        <div class="menu-page" data-page="settings"><div id="settings-list"></div><button class="mbtn back" data-act="back">Back</button></div>
      </div>
      <div class="menu-foot" id="menu-foot"></div>
    </div>
  </div>

  <!-- Chapter complete card -->
  <div id="complete" class="hidden">
    <div class="cp-inner">
      <div class="cp-kicker">Chapter complete</div>
      <div class="cp-title"></div>
      <div class="cp-stats"></div>
      <div class="cp-medal"></div>
      <div class="cp-actions"><button class="mbtn primary" data-act="next">Continue</button><button class="mbtn" data-act="replay">Replay chapter</button></div>
    </div>
  </div>

  <!-- Ending / credits -->
  <div id="credits" class="hidden"><div class="cr-scroll"></div></div>

  <!-- Touch controls (mobile only) -->
  <div id="touch" class="hidden">
    <div id="joy"><div id="joy-knob"></div></div>
    <button id="t-grab" class="tbtn">GRAB</button>
    <button id="t-jump" class="tbtn">JUMP</button>
    <button id="t-rot" class="tbtn small">ROTATE</button>
    <button id="t-pause" class="tbtn tiny">II</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
